    <script src="https://kit.fontawesome.com/d7e1a25fa7.js" crossorigin="anonymous"></script>
    <style>
        /* Card is now the <a> tag itself */
        a#card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
            cursor: pointer;
            /* preserve original #card styles from style.css */
            scroll-snap-align: start;
            flex: 0 0 30em;
            aspect-ratio: 5 / 3;
            height: 16em;
            background-color: #000000;
            padding: 1em;
            border-radius: .5em;
            text-align: center;
            align-content: center;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        a#card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(255,255,255,0.08);
        }

        a#card img {
            width: 100%;
            height: auto;
            object-fit: cover;
            flex: 1;
            border-radius: .3em;
        }

        a#card h3 {
            color: #ffffff;
            margin-top: 0.5em;
        }

        /* pointer-events: none so the overlay never intercepts clicks */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: .5em;
            pointer-events: none;
        }

        a#card:hover .card-overlay {
            opacity: 1;
        }

        .card-overlay span {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
        }

        /* scroll marker dots */
        a#card::scroll-marker {
            content: '';
            height: 1em;
            width: 1em;
            background-color: #ffffff;
            border-radius: 50%;
        }

        a#card::scroll-marker:target-current {
            background-color: green;
        }

        @media screen and (max-width: 768px) {
            a#card {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
